<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>BusGuard — Assembly</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;background:#f2f2ef;}
canvas{display:block;width:100vw;height:100vh;}
#ui{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9;}

/* ── Title: slides down from top, then word pops up ── */
#title-wrap{
  position:absolute;top:0;left:50%;
  transform:translateX(-50%) translateY(-80px);
  text-align:center;padding-top:30px;padding-bottom:6px;
  opacity:0;
}
#title-wrap.slide-in{
  animation:slideDown 1.2s cubic-bezier(0.22,1,0.36,1) forwards;
}
@keyframes slideDown{
  from{opacity:0;transform:translateX(-50%) translateY(-80px);}
  to  {opacity:1;transform:translateX(-50%) translateY(0);}
}
/* Clip container so pop comes from inside */
#word-clip{overflow:hidden;line-height:1.1;padding-bottom:4px;}
#brand-word{
  font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;
  font-size:40px;font-weight:900;letter-spacing:.38em;
  color:#111;text-transform:uppercase;
  display:block;
  transform:translateY(56px);
  opacity:0;
  transition:none;
}
#brand-word.pop{
  animation:popUp 0.78s cubic-bezier(0.34,1.48,0.64,1) forwards;
}
@keyframes popUp{
  from{transform:translateY(56px);opacity:0;}
  to  {transform:translateY(0);   opacity:1;}
}
#brand-sub{
  font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;
  font-size:10px;letter-spacing:.26em;color:#aaa;margin-top:8px;
  text-transform:uppercase;display:block;
  opacity:0;transition:opacity 0.9s ease;
}
#brand-sub.show{opacity:1;}

/* ── Side labels ── */
#labels{position:absolute;top:0;left:0;width:100%;height:100%;}
.lbl{
  position:absolute;
  font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;
  font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  display:flex;align-items:center;gap:5px;
  opacity:0;
  transition:opacity .7s ease, transform .7s ease;
  white-space:nowrap;
}
.lbl.show{opacity:1;transform:translateX(0px)!important;}
.lbl .pip{width:5px;height:5px;border-radius:50%;flex-shrink:0;}
.lbl .dash{width:22px;height:1px;flex-shrink:0;opacity:.35;}
.lbl.right{right:28px;flex-direction:row-reverse;transform:translateX(14px);}
.lbl.left{left:28px;transform:translateX(-14px);}

/* ── Bottom progress dots ── */
#dots{
  position:absolute;bottom:26px;left:50%;transform:translateX(-50%);
  display:flex;gap:7px;align-items:center;
}
.dot{width:6px;height:6px;border-radius:50%;background:#ccc;transition:background .5s,transform .5s;}
.dot.on{background:#111;transform:scale(1.35);}

/* ── Assembled pill ── */
#done{
  position:absolute;bottom:50px;left:50%;transform:translateX(-50%);
  font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;
  background:#111;color:#fff;
  padding:10px 30px;border-radius:100px;
  font-size:10px;letter-spacing:.22em;text-transform:uppercase;font-weight:700;
  opacity:0;transition:opacity 1.1s;white-space:nowrap;
}

/* ── End reveal: full-screen BusGuard pop ── */
#reveal-wrap{
  position:absolute;top:0;left:0;width:100%;height:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  pointer-events:none;
  background:#f2f2ef;
  opacity:0;
  transition:none;
}
#reveal-wrap.show{opacity:1;}
#reveal-clip{overflow:hidden;line-height:1.05;padding-bottom:8px;}
#reveal-word{
  font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;
  font-size:clamp(72px,11vw,132px);font-weight:900;letter-spacing:.22em;
  color:#f97316;text-transform:uppercase;
  display:block;
  transform:translateY(140px);opacity:0;
}
#reveal-word.pop{
  animation:bigPop 0.92s cubic-bezier(0.34,1.46,0.64,1) forwards;
}
@keyframes bigPop{
  from{transform:translateY(140px);opacity:0;}
  to  {transform:translateY(0);    opacity:1;}
}
#reveal-sub{
  font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;
  font-size:12px;letter-spacing:.32em;color:#aaa;margin-top:16px;
  text-transform:uppercase;display:block;
  opacity:0;transition:opacity 1.0s ease;
}
#reveal-sub.show{opacity:1;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="title-wrap">
    <div id="word-clip"><span id="brand-word">BusGuard</span></div>
    <span id="brand-sub">Intelligent Bus Safety System</span>
  </div>
  <div id="dots"></div>
  <div id="reveal-wrap">
    <div id="reveal-clip"><span id="reveal-word">BusGuard</span></div>
    <span id="reveal-sub">School Bus Safety, Reimagined</span>
  </div>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}
</script>
<script type="module">
import * as THREE from 'three';

// ─── Renderer — maximum quality ───────────────────────────────────────────────
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:false, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2.5));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;

// ─── Scene ────────────────────────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf2f2ef);

// ─── Camera ───────────────────────────────────────────────────────────────────
const camera = new THREE.PerspectiveCamera(32, window.innerWidth/window.innerHeight, 0.05, 120);
camera.position.set(5.2, 3.4, 7.8);
camera.lookAt(0, 0.15, 0);

// ─── Lighting — multi-source studio ──────────────────────────────────────────
// Warm key from upper-right
const key = new THREE.DirectionalLight(0xfff6e8, 3.0);
key.position.set(9, 14, 9);
key.castShadow = true;
key.shadow.mapSize.width  = 4096;
key.shadow.mapSize.height = 4096;
key.shadow.camera.left   = -6; key.shadow.camera.right = 6;
key.shadow.camera.top    =  6; key.shadow.camera.bottom= -6;
key.shadow.camera.near   = 0.5; key.shadow.camera.far  = 40;
key.shadow.bias = -0.0002;
key.shadow.normalBias = 0.02;
scene.add(key);

// Cool fill from left
const fill = new THREE.DirectionalLight(0xd0e4ff, 1.2);
fill.position.set(-10, 6, -3);
scene.add(fill);

// Soft bounce from below
const bounce = new THREE.DirectionalLight(0xfff8f0, 0.4);
bounce.position.set(0, -8, 4);
scene.add(bounce);

// Ambient
const ambient = new THREE.AmbientLight(0xffffff, 0.7);
scene.add(ambient);

// Subtle rim from behind
const rim = new THREE.DirectionalLight(0xe8f4ff, 0.5);
rim.position.set(-2, 3, -10);
scene.add(rim);

// Ground shadow catcher
const gnd = new THREE.Mesh(
  new THREE.PlaneGeometry(60,60),
  new THREE.ShadowMaterial({opacity:0.10})
);
gnd.rotation.x = -Math.PI/2; gnd.position.y = -1.3; gnd.receiveShadow = true;
scene.add(gnd);

// ─── Material helpers ─────────────────────────────────────────────────────────
const S = (c,r=0.5,m=0.2,x={})=> new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m,...x});
const M = (geo,mat)=>{ const o=new THREE.Mesh(geo,mat); o.castShadow=true; o.receiveShadow=true; return o; };
const B = (w,h,d,segs=2)=> new THREE.BoxGeometry(w,h,d,segs,segs,segs);
const C = (rt,rb,h,s=28)=> new THREE.CylinderGeometry(rt,rb,h,s);
const T = (r,t,rs=8,ts=32)=> new THREE.TorusGeometry(r,t,rs,ts);

// ─── HOUSING ─────────────────────────────────────────────────────────────────
function buildHousing(){
  const g = new THREE.Group();
  const W=2.4, H=1.35, D=1.55, TH=0.092;

  const shell  = S(0x252530, 0.42, 0.45);
  const inner  = S(0x18181f, 0.75, 0.05);
  const accent = S(0xf97316, 0.28, 0.72);
  const rubber = S(0x0f0f14, 0.97, 0.0);
  const edgeS  = S(0x3c3c50, 0.25, 0.75);

  // Walls
  const addBox=(w,h,d,px,py,pz,mat)=>{const o=M(B(w,h,d),mat);o.position.set(px,py,pz);g.add(o);};
  addBox(W,    TH, D,   0, -H/2+TH/2, 0,     shell); // bottom
  addBox(TH,   H,  D,   -W/2+TH/2, 0, 0,    shell); // left
  addBox(TH,   H,  D,    W/2-TH/2, 0, 0,    shell); // right
  addBox(W,    H,  TH,   0, 0, -D/2+TH/2,   shell); // back
  addBox(W,    H,  TH,   0, 0,  D/2-TH/2,   shell); // front

  // Orange corner edge strips — top corners
  const eW=0.03;
  [[W/2-eW/2, H/2-eW/2,0],[-W/2+eW/2,H/2-eW/2,0],
   [W/2-eW/2,-H/2+eW/2,0],[-W/2+eW/2,-H/2+eW/2,0]].forEach(([x,y])=>{
    const ec=M(B(eW,eW,D+0.002),edgeS); ec.position.set(x,y,0); g.add(ec);
  });

  // Orange accent line — front top
  const aLine=M(B(W,0.018,0.018),accent);
  aLine.position.set(0,H/2-0.009,D/2); g.add(aLine);
  // Orange accent bottom front
  const aBot=M(B(W,0.018,0.018),accent);
  aBot.position.set(0,-H/2+0.009,D/2); g.add(aBot);

  // Camera aperture (recessed dark hole in front wall)
  const camRecess=M(B(0.52,0.40,0.14),inner);
  camRecess.position.set(0.50,0.04,D/2+0.03); g.add(camRecess);
  // Orange ring around camera aperture
  const camRing=M(T(0.19,0.018,10,32),accent);
  camRing.rotation.x=Math.PI/2; camRing.position.set(0.50,0.04,D/2+0.01); g.add(camRing);
  // Inner lens shadow
  const lensShadow=M(new THREE.CircleGeometry(0.17,28),inner);
  lensShadow.rotation.x=Math.PI/2; lensShadow.position.set(0.50,0.04,D/2+0.065); g.add(lensShadow);

  // Pi camera aperture (left wall, small rectangle)
  const piAp=M(B(0.055,0.16,0.24),inner);
  piAp.position.set(-W/2+0.015,0.06,0.08); g.add(piAp);
  // Orange micro-frame
  const piFrame=M(T(0.08,0.012,8,20),accent);
  piFrame.rotation.z=Math.PI/2; piFrame.position.set(-W/2,0.06,0.08); g.add(piFrame);

  // Interior floor tray
  const tray=M(B(W-0.2,0.05,D-0.2),inner);
  tray.position.y=-H/2+TH+0.025; g.add(tray);

  // Cable management channels on floor
  for(let x=-0.75;x<=0.75;x+=0.38){
    const ch=M(B(0.038,0.032,D-0.25),S(0x111116,0.85,0.05));
    ch.position.set(x,-H/2+TH+0.04,0); g.add(ch);
  }

  // Screw bosses on interior
  [[-W/2+0.2,-H/2+TH,D/2-0.2],[W/2-0.2,-H/2+TH,D/2-0.2],
   [-W/2+0.2,-H/2+TH,-D/2+0.2],[W/2-0.2,-H/2+TH,-D/2+0.2]].forEach(p=>{
    const boss=M(C(0.04,0.04,0.1,10),S(0x303038,0.5,0.3));
    boss.position.set(...p); g.add(boss);
    const screw=M(C(0.018,0.018,0.05,8),S(0xaaa870,0.2,0.92));
    screw.position.set(p[0],p[1]+0.075,p[2]); g.add(screw);
  });

  // Rubber feet
  [[-W/2+0.18,-H/2-0.044,D/2-0.18],[W/2-0.18,-H/2-0.044,D/2-0.18],
   [-W/2+0.18,-H/2-0.044,-D/2+0.18],[W/2-0.18,-H/2-0.044,-D/2+0.18]].forEach(p=>{
    const f=M(C(0.065,0.078,0.065,14),rubber); f.position.set(...p); g.add(f);
  });

  // Vent slots on back wall
  for(let i=0;i<5;i++){
    const v=M(B(0.32,0.028,0.018),inner);
    v.position.set(-0.5+i*0.26,0.2,-D/2+0.005); g.add(v);
  }

  // Label plate (white silk-screen area on front)
  const plate=M(B(0.7,0.14,0.005),S(0xeeeeea,0.85,0.02));
  plate.position.set(-0.6,-0.35,D/2+0.002); g.add(plate);

  return g;
}

// ─── PCB — Raspberry Pi 3B+ ───────────────────────────────────────────────────
function buildPCB(){
  const g = new THREE.Group();
  const pcbMat  = S(0x1e6622, 0.58, 0.06);
  const goldMat = S(0xe0aa18, 0.18, 0.92);
  const chipMat = S(0x18181e, 0.28, 0.78);
  const silv    = S(0xb8b8c4, 0.28, 0.82);
  const creaMat = S(0xddd5b0, 0.88, 0.02);

  // Board
  const board=M(B(1.82,0.046,1.16,3,1,3),pcbMat); g.add(board);

  // Silk-screen grid lines
  for(let i=0;i<6;i++){
    const sl=M(B(1.6+Math.random()*0.1,0.002,0.008),creaMat);
    sl.position.set(-0.3+Math.random()*0.2,0.024,-0.3+i*0.11); g.add(sl);
  }

  // ── SoC (BCM2837) — large with metallic heat spreader
  const soc=M(B(0.34,0.036,0.34),chipMat); soc.position.set(-0.24,0.041,0.02); g.add(soc);
  const heatSpreader=M(B(0.28,0.009,0.28),S(0x8a8870,0.12,0.95));
  heatSpreader.position.set(-0.24,0.066,0.02); g.add(heatSpreader);
  // SoC solder bumps row
  for(let r=0;r<4;r++) for(let c=0;c<4;c++){
    const bump=M(C(0.007,0.007,0.012,6),goldMat);
    bump.position.set(-0.34+c*0.055,0.038,-0.065+r*0.055); g.add(bump);
  }

  // ── RAM chip
  const ram=M(B(0.22,0.030,0.18),chipMat); ram.position.set(0.14,0.038,-0.12); g.add(ram);
  // RAM markings (white dot)
  const rmDot=M(new THREE.CircleGeometry(0.008,8),S(0xffffff,0.5,0));
  rmDot.rotation.x=-Math.PI/2; rmDot.position.set(0.06,0.054,-0.18); g.add(rmDot);

  // ── WiFi/BT module (small silver square)
  const wfMod=M(B(0.14,0.018,0.12),S(0xc8c8b8,0.25,0.80));
  wfMod.position.set(0.38,0.032,0.2); g.add(wfMod);
  // Antenna trace on module
  const ant=M(B(0.05,0.003,0.09),goldMat); ant.position.set(0.42,0.042,0.2); g.add(ant);

  // ── USB 2.0 × 2 (stacked, silver)
  [-0.22,0.22].forEach(z=>{
    const port=M(B(0.165,0.078,0.068),silv); port.position.set(0.91,0.062,z); g.add(port);
    const cavity=M(B(0.12,0.052,0.044),S(0x444452,0.6)); cavity.position.set(0.94,0.062,z); g.add(cavity);
    // Port rim detail
    const rim=M(B(0.005,0.078,0.068),S(0xd0d0c0,0.2,0.9)); rim.position.set(0.825,0.062,z); g.add(rim);
  });

  // ── Ethernet (taller, tan housing)
  const eth=M(B(0.148,0.095,0.235),S(0xb8a468,0.38,0.45));
  eth.position.set(0.91,0.075,0.43); g.add(eth);
  const ethCav=M(B(0.105,0.062,0.19),S(0x444452,0.6));
  ethCav.position.set(0.94,0.075,0.43); g.add(ethCav);
  // Ethernet LEDs (tiny)
  [{c:0xffaa00,z:0.32},{c:0x00ff44,z:0.52}].forEach(({c,z})=>{
    const led=M(B(0.018,0.018,0.005),S(c,0.2,0,{emissive:c,emissiveIntensity:3}));
    led.position.set(0.9,0.095,z); g.add(led);
  });

  // ── HDMI × 1
  const hdmi=M(B(0.115,0.056,0.168),S(0x222228,0.5,0.42));
  hdmi.position.set(-0.64,0.048,0.56); g.add(hdmi);

  // ── Micro-USB power
  const uPow=M(B(0.075,0.036,0.058),S(0x888888,0.38,0.6));
  uPow.position.set(-0.84,0.038,0.56); g.add(uPow);

  // ── 3.5mm audio (teal cylinder)
  const aud=M(C(0.030,0.030,0.068,14),S(0x22aacc,0.28,0.65));
  aud.rotation.z=Math.PI/2; aud.position.set(-0.44,0.040,0.56); g.add(aud);

  // ── GPIO header (2×13 gold pins in black housing)
  const gpioBase=M(B(0.88,0.028,0.152),S(0x111116,0.82));
  gpioBase.position.set(-0.42,0.037,-0.47); g.add(gpioBase);
  for(let col=0;col<2;col++) for(let i=0;i<13;i++){
    const pin=M(C(0.0078,0.0078,0.065,6),goldMat);
    pin.position.set(-0.81+i*0.068,0.044,-0.44+col*0.068); g.add(pin);
  }

  // ── MicroSD slot
  const sd=M(B(0.17,0.016,0.105),silv); sd.position.set(0.22,-0.022,-0.54); g.add(sd);

  // ── Status LEDs
  [{c:0x00ff55,x:0.70,z:-0.39},{c:0xff4400,x:0.59,z:-0.39}].forEach(({c,x,z})=>{
    const led=M(new THREE.SphereGeometry(0.016,10,10),S(c,0.2,0,{emissive:c,emissiveIntensity:3.5}));
    led.position.set(x,0.038,z); g.add(led);
  });

  // ── Gold traces (many, varied)
  for(let i=0;i<18;i++){
    const tr=M(B(0.35+Math.random()*0.8,0.0028,0.007),goldMat);
    tr.position.set(-0.5+Math.random()*0.9,0.024,-0.38+i*0.045); g.add(tr);
  }

  // ── Capacitors (electrolytic — cylindrical, dark)
  [[0.3,0,-0.32],[0.55,0,0.08],[-0.5,0,0.28],[0.15,0,0.34]].forEach(([x,,z])=>{
    const cap=M(C(0.022,0.022,0.055,10),S(0x1a1a1a,0.55,0.15));
    cap.position.set(x,0.05,z); g.add(cap);
    const capTop=M(new THREE.CircleGeometry(0.019,10),S(0x888870,0.2,0.8));
    capTop.rotation.x=-Math.PI/2; capTop.position.set(x,0.078,z); g.add(capTop);
  });

  // ── Mounting holes
  [[-0.82,0,0.50],[0.82,0,0.50],[-0.82,0,-0.50],[0.82,0,-0.50]].forEach(p=>{
    const h=M(C(0.030,0.030,0.052,12),S(0xf0edd0,0.9,0)); h.position.set(...p); g.add(h);
  });

  return g;
}

// ─── 3-Axis Accelerometer ─────────────────────────────────────────────────────
function buildAccelerometer(){
  const g = new THREE.Group();
  const pcb=S(0x1a44cc,0.58,0.08);
  const gold=S(0xe0aa18,0.18,0.92);
  const chip=S(0x18181e,0.28,0.78);

  // Blue PCB substrate (ADXL345 breakout style)
  const sub=M(B(0.38,0.014,0.30),pcb); g.add(sub);

  // White silkscreen label area
  const silk=M(B(0.28,0.002,0.08),S(0xeeeeee,0.9,0));
  silk.position.set(0,0.008,-0.06); g.add(silk);

  // Main MEMS IC (black, square LCC package)
  const ic=M(B(0.155,0.035,0.155),chip); ic.position.set(0.02,0.025,0.02); g.add(ic);
  // IC corner marker dot
  const mDot=M(new THREE.CircleGeometry(0.01,8),S(0xffffff,0.5,0));
  mDot.rotation.x=-Math.PI/2; mDot.position.set(-0.04,0.044,-0.04); g.add(mDot);
  // IC pad ring (gold)
  for(let i=0;i<4;i++){
    const side=[[0.08,0,0.02],[- 0.04,0,0.1],[-0.08,0,0.02],[-0.04,0,-0.06]];
    const pad=M(B(0.026,0.003,0.008),gold);
    pad.position.set(side[i][0]+0.02,0.045,side[i][2]+0.02); g.add(pad);
  }

  // Decoupling capacitors
  [[-0.1,0.05,0.08],[0.12,0.05,-0.08],[0.13,0.05,0.1]].forEach(p=>{
    const c=M(B(0.025,0.022,0.018),S(0xddaa20,0.4,0.25)); c.position.set(...p); g.add(c);
  });

  // Header pins (gold, 6-pin SPI)
  for(let i=0;i<6;i++){
    const pin=M(C(0.008,0.008,0.068,6),gold);
    pin.position.set(-0.13+i*0.052,0.022,-0.13); g.add(pin);
  }

  // PCB corner holes
  [[-0.16,0,0.12],[0.16,0,0.12],[-0.16,0,-0.12],[0.16,0,-0.12]].forEach(p=>{
    const h=M(C(0.016,0.016,0.018,8),S(0xf0edd0,0.9,0)); h.position.set(...p); g.add(h);
  });

  // FPC connector
  const fpc=M(B(0.09,0.010,0.105),S(0xf5c020,0.5,0.1));

  p.delay += (PAIRS[pairIdx].indexOf(i)) * 0.15;
});

  {p:[2,-7,4],       r:[0.5,0,0]},    // wifi — front down
  {p:[-7,5,1],       r:[0,-0.5,0.3]}, // buzzers — top left
  {p:[7,2,7],        r:[0,-Math.PI/2+0.5,0.2]}, // varifocal — front right
  {p:[-7,4,1],       r:[0.3,Math.PI/2-0.5,0]},  // piCam — left
];

// Timeline dots
const dotEls=PIECES.map(()=>{
  const d=document.createElement('div');
  d.className='dot'; dotsEl.appendChild(d); return d;
});

// ─── Easing ───────────────────────────────────────────────────────────────────
function easeOutQuint(t){ return 1-Math.pow(1-t,5); }
function easeInQuint(t){ return t*t*t*t*t; }
function lerp(a,b,t){ return a+(b-a)*t; }

// ─── State ────────────────────────────────────────────────────────────────────
let et=0;
let phase='assembling'; // assembling | holding | exploding | revealing
let phaseT=0;
let sceneRotY=0;
let idleT=0;
let camTargetY=2.8;
const clock=new THREE.Clock();

// ─── Title animation ──────────────────────────────────────────────────────────
const titleWrap = document.getElementById('title-wrap');
const brandWord = document.getElementById('brand-word');
const brandSub  = document.getElementById('brand-sub');
const revealWrap= document.getElementById('reveal-wrap');
const revealWord= document.getElementById('reveal-word');
const revealSub = document.getElementById('reveal-sub');

function triggerTitleIntro(){
  void titleWrap.offsetWidth;
  titleWrap.style.animation='none';
  titleWrap.classList.remove('slide-in');
  brandWord.classList.remove('pop');
  brandSub.classList.remove('show');
  brandWord.style.transform='translateY(56px)';
  brandWord.style.opacity='0';
  setTimeout(()=>{ titleWrap.classList.add('slide-in'); }, 200);
  setTimeout(()=>{ brandWord.classList.add('pop'); }, 1000);
  setTimeout(()=>{ brandSub.classList.add('show'); }, 1550);
}

function hideTitleBar(){
  titleWrap.style.transition='opacity 0.6s ease, transform 0.6s ease';
  titleWrap.style.opacity='0';
  titleWrap.style.transform='translateX(-50%) translateY(-40px)';
}

function resetTitleBar(){
  titleWrap.style.transition='none';
  titleWrap.style.opacity='0';
  titleWrap.style.transform='translateX(-50%) translateY(-80px)';
}

function triggerReveal(){
  revealWrap.style.opacity='1'; // snap white bg immediately — covers 3D canvas
  revealWord.classList.remove('pop');
  revealSub.classList.remove('show');
  revealWord.style.transform='translateY(140px)';
  revealWord.style.opacity='0';
  revealWrap.classList.add('show');
  setTimeout(()=>{ revealWord.classList.add('pop'); }, 100);
  setTimeout(()=>{ revealSub.classList.add('show'); }, 780);
}

function hideReveal(){
  revealWrap.style.opacity='0';
  revealWrap.classList.remove('show');
  revealWord.classList.remove('pop');
  revealSub.classList.remove('show');
}

function resetCycle(){
  et=0; phaseT=0; phase='assembling';
  sceneRotY=0; idleT=0;
  doneEl.style.opacity='0';
  hideReveal();
  resetTitleBar();
  PIECES.forEach(({obj,start})=>{
    obj.position.set(...start.p);
    obj.rotation.set(...start.r);
  });
  dotEls.forEach(d=>d.classList.remove('on'));
  // small delay so resets settle, then fire intro
  setTimeout(triggerTitleIntro, 80);
}

triggerTitleIntro();

// ─── Scroll-away detection ────────────────────────────────────────────────────
// If user scrolls down (away from this hero section) and returns, skip the
// animation entirely and just show the orange BusGuard reveal permanently.
let hasScrolledAway = false;
let lockedToReveal  = false;

function lockToReveal(){
  if(lockedToReveal) return;
  lockedToReveal = true;
  // Freeze animation clock so tick does nothing except render blank
  phase = 'locked';
  // Hide all 3D pieces
  const allObjs=[housing,...PIECES.map(p=>p.obj)];
  allObjs.forEach(obj=>obj.traverse(c=>{
    if(c.isMesh&&c.material){ c.material.transparent=true; c.material.opacity=0; }
  }));
  hideTitleBar();
  doneEl.style.opacity='0';
  // Show the orange reveal immediately, no animation delay
  revealWrap.style.opacity='1';
  revealWrap.classList.add('show');
  revealWord.style.transform='translateY(0)';
  revealWord.style.opacity='1';
  // Ensure sub is visible
  revealSub.classList.add('show');
}

window.addEventListener('scroll', ()=>{
  if(window.scrollY > 80){
    hasScrolledAway = true;
  }
  if(hasScrolledAway && window.scrollY < 40 && !lockedToReveal){
    lockToReveal();
  }
}, {passive:true});

// ─── Tick ─────────────────────────────────────────────────────────────────────
function tick(){
  requestAnimationFrame(tick);
  const dt=Math.min(clock.getDelta(),0.035);

  // Locked to orange reveal — just render blank scene, skip all animation
  if(lockedToReveal){
    renderer.render(scene,camera);
    return;
  }

  et+=dt; phaseT+=dt;

  // ── Phase transitions
  if(phase==='assembling' && phaseT>=TOTAL_ANIM){
    phase='holding'; phaseT=0;
    doneEl.style.opacity='1';
    idleT=0;
  }
  if(phase==='holding' && phaseT>=HOLD){
    phase='exploding'; phaseT=0;
    doneEl.style.opacity='0';
    hideTitleBar();
  }
  if(phase==='exploding' && phaseT>=EXPLODE_DUR+PAUSE_BEFORE_REVEAL){
    phase='revealing'; phaseT=0;
    triggerReveal();
  }
  if(phase==='revealing' && phaseT>=REVEAL_DUR){
    resetCycle();
    return;
  }

  // ── Assemble pieces
  PIECES.forEach(({obj,start,final,delay},i)=>{
    if(phase==='assembling'||phase==='holding'){
      const raw=(et-delay)/PIECE_DURATION;
      const t01=Math.max(0,Math.min(1,raw));
      const ease=easeOutQuint(t01);
      obj.position.x=lerp(start.p[0],final.p[0],ease);
      obj.position.y=lerp(start.p[1],final.p[1],ease);
      obj.position.z=lerp(start.p[2],final.p[2],ease);
      obj.rotation.x=lerp(start.r[0],final.r[0],ease);
      obj.rotation.y=lerp(start.r[1],final.r[1],ease);
      obj.rotation.z=lerp(start.r[2],final.r[2],ease);
      if(t01>0.04) dotEls[i].classList.add('on');
    }
    if(phase==='exploding'||phase==='revealing'){
      const ex=EXPLODE[i];
      const raw=phaseT/EXPLODE_DUR;
      const t01=Math.max(0,Math.min(1,raw));
      const ease=easeInQuint(t01);
      obj.position.x=lerp(final.p[0],ex.p[0],ease);
      obj.position.y=lerp(final.p[1],ex.p[1],ease);
      obj.position.z=lerp(final.p[2],ex.p[2],ease);
      obj.rotation.x=lerp(final.r[0],ex.r[0],ease);
      obj.rotation.y=lerp(final.r[1],ex.r[1],ease);
      obj.rotation.z=lerp(final.r[2],ex.r[2],ease);
    }
  });

  // All 3D objects: fade out together during explode so screen is totally clear for reveal
  const allObjs=[housing,...PIECES.map(p=>p.obj)];
  if(phase==='exploding'){
    const t01=Math.min(phaseT/EXPLODE_DUR,1);
    const opacity=lerp(1,0,easeInQuint(t01));
    allObjs.forEach(obj=>obj.traverse(c=>{
      if(c.isMesh&&c.material){ c.material.transparent=true; c.material.opacity=opacity; }
    }));
  } else if(phase==='revealing'){
    // completely invisible — the reveal-wrap white bg covers everything
    allObjs.forEach(obj=>obj.traverse(c=>{
      if(c.isMesh&&c.material){ c.material.transparent=true; c.material.opacity=0; }
    }));
  } else {
    allObjs.forEach(obj=>obj.traverse(c=>{
      if(c.isMesh&&c.material){ c.material.transparent=false; c.material.opacity=1; }
    }));
  }

  // ── Scene rotation
  if(phase==='holding'){
    idleT+=dt;
    sceneRotY=lerp(sceneRotY, Math.sin(idleT*0.22)*0.28, 0.014);
  } else if(phase==='exploding'){
    // Spin slightly as things scatter
    sceneRotY=lerp(sceneRotY, sceneRotY+0.008, 0.1);
  } else if(phase==='assembling'){
    sceneRotY=lerp(sceneRotY,0,0.025);
  }
  scene.rotation.y=sceneRotY;

  // Camera breathe
  camTargetY=2.8+Math.sin(et*0.2)*0.05;
  camera.position.y=lerp(camera.position.y,camTargetY,0.03);

  renderer.render(scene,camera);
}
tick();

window.addEventListener('resize',()=>{
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});
</script>
</body>
</html>
